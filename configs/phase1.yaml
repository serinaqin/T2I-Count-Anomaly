# Phase 1 seed-swap: the SAME seeds are crossed against every (count, object),
# so each seed's initial noise is reused across prompts (the swap).
# 5 counts x 4 objects x 8 seeds = 160 images. Shrink `seeds` for a first pilot.
counts: [1, 2, 3, 4, 5]
objects: [cat, dog, apple, car]
seeds: [0, 1, 2, 3, 4, 5, 6, 7]
num_inference_steps: 30
score_threshold: 0.3
