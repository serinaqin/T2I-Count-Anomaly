# Phase 2c-v2 causal patch SWEEP: find WHERE patching moves the count.
# Capture donor activations at a superset of sites/steps, then patch subsets.
counts: [2, 5]
objects: [cat]
seeds: [0, 1, 2, 3, 4, 5]
num_inference_steps: 30
score_threshold: 0.3
pairs: [[2, 5], [5, 2]]                      # (source, donor)
capture_blocks: [up_blocks.0, mid_block]     # capture attn1+attn2 here
capture_steps: [0, 1, 2, 3, 4, 5, 6, 10, 15] # early (0-5) + mid (6,10,15)
# Each sweep entry patches a (block, attention-type, step-window) subset:
sweep:
  - {name: up0_attn2_mid,   block: up_blocks.0, attn: attn2, steps: [6, 10, 15]}
  - {name: up0_attn1_early, block: up_blocks.0, attn: attn1, steps: [0, 1, 2, 3, 4, 5]}
  - {name: up0_attn2_early, block: up_blocks.0, attn: attn2, steps: [0, 1, 2, 3, 4, 5]}
  - {name: up0_both_wide,   block: up_blocks.0, attn: both,  steps: [0, 1, 2, 3, 4, 5, 6, 10, 15]}
  - {name: mid_both_mid,    block: mid_block,   attn: both,  steps: [6, 10, 15]}
